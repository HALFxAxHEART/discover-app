<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Library — InkStream</title>
<link rel="icon" href="/grid/favicon.ico" />
<style>
  :root {
    --primary: #3060ad;
    --secondary: #b64499;
    --bg: #16191f;
    --card-bg: #1c2028;
    --text: #e8eaed;
    --text-muted: rgba(232, 234, 237, 0.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 1.25rem 1.5rem;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  main { padding: 1rem 1.5rem; max-width: 1800px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.25rem;
  }
  a.card {
    background: var(--card-bg);
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: var(--text);
  }
  .card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #0e1015;
  }
  .card .body { padding: 0.6rem; }
  .card .title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
  .card .updated { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; }
  .status { color: var(--text-muted); padding: 2rem 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>My Library — Recently Updated</h1>
</header>
<main>
  <div id="results" class="grid"><div class="status">Loading...</div></div>
</main>
<script>
  fetch('/grid/api/library')
    .then(function (r) { return r.json(); })
    .then(function (data) { render(data.series); })
    .catch(function () {
      document.getElementById('results').innerHTML = '<div class="status">Failed to load. Try again.</div>';
    });

  function render(list) {
    var results = document.getElementById('results');
    if (!list.length) {
      results.innerHTML = '<div class="status">No series yet.</div>';
      return;
    }
    results.innerHTML = '';
    list.forEach(function (item) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = '/library/' + item.libraryId + '/series/' + item.id;

      var img = document.createElement('img');
      img.src = '/grid/api/cover/' + item.id;
      img.loading = 'lazy';
      card.appendChild(img);

      var body = document.createElement('div');
      body.className = 'body';

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = item.name;
      body.appendChild(title);

      var updated = document.createElement('div');
      updated.className = 'updated';
      updated.textContent = item.lastChapterAddedRelative;
      body.appendChild(updated);

      card.appendChild(body);
      results.appendChild(card);
    });
  }
</script>
</body>
</html>
